<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Page Pulse — URL Audit Tool</title>
<style>
  :root {
    --bg: #0f1117;
    --card: #171a23;
    --border: #262a36;
    --text: #e6e8ef;
    --muted: #8b90a3;
    --accent: #6c8cff;
    --good: #3ecf8e;
    --warn: #f5a623;
    --bad: #f0556d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #171a23, #0f1117 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 24px;
  }
  header { text-align: center; margin-bottom: 32px; }
  h1 { font-size: 2rem; margin: 0 0 6px; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  header p { color: var(--muted); margin: 0; }

  .search-box {
    width: 100%;
    max-width: 640px;
    display: flex;
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--border);
    padding: 8px;
    border-radius: 14px;
  }
  .search-box input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 1rem;
    padding: 10px 12px;
  }
  .search-box button {
    background: var(--accent);
    color: #0f1117;
    border: none;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.95rem;
    transition: opacity 0.15s;
  }
  .search-box button:disabled { opacity: 0.6; cursor: default; }

  .status-line {
    max-width: 640px;
    width: 100%;
    margin-top: 12px;
    font-size: 0.9rem;
    min-height: 20px;
  }
  .status-line.error { color: var(--bad); }
  .status-line.loading { color: var(--muted); }

  .report {
    width: 100%;
    max-width: 640px;
    margin-top: 24px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    display: none;
  }
  .report.visible { display: block; }
  .report-url {
    color: var(--muted);
    font-size: 0.85rem;
    word-break: break-all;
    margin-bottom: 18px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .metric {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
  }
  .metric .label {
    color: var(--muted);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }
  .metric .value { font-size: 1.15rem; font-weight: 600; }
  .metric .value.good { color: var(--good); }
  .metric .value.warn { color: var(--warn); }
  .metric .value.bad { color: var(--bad); }

  .full-row { grid-column: 1 / -1; }
  .text-block {
    font-size: 0.95rem;
    line-height: 1.4;
    color: var(--text);
  }
  .text-block.muted { color: var(--muted); font-style: italic; }

  footer {
    margin-top: auto;
    padding-top: 40px;
    color: var(--muted);
    font-size: 0.8rem;
    text-align: center;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <header>
    <h1>Page <span>Pulse</span></h1>
    <p>Paste any URL. Get an instant health &amp; SEO snapshot.</p>
  </header>

  <form class="search-box" id="auditForm">
    <input
      type="text"
      id="urlInput"
      placeholder="https://example.com"
      autocomplete="off"
      required
    />
    <button type="submit" id="submitBtn">Audit</button>
  </form>

  <div class="status-line" id="statusLine"></div>

  <section class="report" id="report">
    <div class="report-url" id="reportUrl"></div>
    <div class="grid" id="reportGrid"></div>
  </section>

  <footer>
    Built for
    <a href="https://digitalheroesco.com" target="_blank" rel="noopener noreferrer">
      Digital Heroes Training Task
    </a>
  </footer>

  <script>
    const form = document.getElementById("auditForm");
    const input = document.getElementById("urlInput");
    const btn = document.getElementById("submitBtn");
    const statusLine = document.getElementById("statusLine");
    const report = document.getElementById("report");
    const reportUrl = document.getElementById("reportUrl");
    const reportGrid = document.getElementById("reportGrid");

    function setStatus(text, kind) {
      statusLine.textContent = text || "";
      statusLine.className = "status-line" + (kind ? " " + kind : "");
    }

    function metric(label, value, tone) {
      const cls = tone ? " " + tone : "";
      return `
        <div class="metric">
          <div class="label">${label}</div>
          <div class="value${cls}">${value}</div>
        </div>
      `;
    }

    function fullRow(label, value, muted) {
      return `
        <div class="metric full-row">
          <div class="label">${label}</div>
          <div class="text-block${muted ? " muted" : ""}">${value}</div>
        </div>
      `;
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function renderReport(data) {
      reportUrl.textContent = data.url;

      const statusTone = data.ok ? "good" : "bad";
      const speedTone =
        data.responseTimeMs < 800 ? "good" : data.responseTimeMs < 2000 ? "warn" : "bad";
      const h1Tone = data.h1Count === 1 ? "good" : "warn";
      const altTone = data.imagesMissingAlt === 0 ? "good" : "bad";

      reportGrid.innerHTML =
        metric("HTTP Status", data.httpStatus, statusTone) +
        metric("Response Time", data.responseTimeMs + " ms", speedTone) +
        metric("H1 Count", data.h1Count, h1Tone) +
        metric("Images Missing Alt", data.imagesMissingAlt, altTone) +
        metric("Word Count", data.wordCount) +
        metric("Status", data.ok ? "Reachable" : "Error response") +
        fullRow(
          "Page Title",
          data.title ? escapeHtml(data.title) : "No title tag found",
          !data.title
        ) +
        fullRow(
          "Meta Description",
          data.metaDescription ? escapeHtml(data.metaDescription) : "No meta description found",
          !data.metaDescription
        );

      report.classList.add("visible");
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const url = input.value.trim();
      if (!url) return;

      btn.disabled = true;
      report.classList.remove("visible");
      setStatus("Auditing page…", "loading");

      try {
        const res = await fetch("/api/audit", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });

        const data = await res.json();

        if (!res.ok) {
          setStatus(data.message || "Something went wrong.", "error");
          return;
        }

        setStatus("");
        renderReport(data);
      } catch (err) {
        setStatus("Network error — is the server running?", "error");
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
